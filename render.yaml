# Render Blueprint for the backend API.
#
# NOT verified against a live Render account — this sandbox cannot reach
# Render's API/dashboard to confirm Render actually accepts this exact
# syntax. Treat it as a documented starting point, not a tested config:
# check it against Render's current Blueprint spec (render.com/docs/blueprint-spec)
# before relying on it, and prefer the manual dashboard settings in
# docs/DEPLOYMENT.md if anything here doesn't match what Render's UI shows.
#
# Root Directory is intentionally left at the repo root (not "server/") —
# this is an npm-workspaces monorepo, and pointing Render's Root Directory
# at server/ in isolation would skip hoisted root-level dependency
# resolution. The build/start commands below scope npm to the server
# workspace instead, from the repo root.

services:
  - type: web
    name: trustloop-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace server
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
